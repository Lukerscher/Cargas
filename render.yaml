services:
  - type: web
    name: almoxcontrol
    runtime: python
    plan: starter
    region: ohio
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --workers 1 --threads 4 --bind 0.0.0.0:$PORT --timeout 120 app:app
    autoDeploy: true
    disk:
      name: almoxcontrol-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: DATABASE_PATH
        value: /var/data/almoxcontrol.sqlite
      - key: SECRET_KEY
        generateValue: true
      - key: FLASK_ENV
        value: production